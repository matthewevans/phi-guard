# Codex reads this legacy managed config as enforced policy, not as overridable
# defaults: a session cannot select an approval policy other than on-request, and
# its sandbox cannot leave the modes allowed in requirements.toml.
#
# Codex runs with full access because the container is the boundary (egress
# firewall, root-owned config, CLIs and plugin, non-root user, no sudo beyond the
# firewall script), matching Claude Code, which has no OS sandbox here either. Codex's
# own bubblewrap sandbox cannot create namespaces under Docker's default seccomp
# profile, so every command would fail, and the container is not loosened to allow it.
sandbox_mode = "danger-full-access"
approval_policy = "on-request"

# Make the sandbox obvious in the Codex TUI: the container hostname (fixed by --hostname
# in devcontainer.json) leads the status line. Terminal title items have no hostname
# option, so the title carries only the activity and the project.
[tui]
status_line = ["hostname", "model-with-reasoning", "five-hour-limit", "weekly-limit", "current-dir"]
terminal_title = ["activity", "project-name"]
